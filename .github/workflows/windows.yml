name: windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libxi-dev libxext-dev libxrandr-dev libxtst-dev xserver-xephyr xvfb dbus-x11 xdotool xclip x11-xserver-utils
      - name: Build Linux
        run: make -j2 all tests/linux_runtime_test
      - name: Isolated Linux acceptance tests
        run: xvfb-run -a make test
      - name: Package Linux release
        run: bash scripts/make-linux-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cronq-linux
          path: dist/*

  build:
    needs: linux
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download frontend gate regression
        run: node frontend/test-download.mjs
      - name: Configure
        run: cmake -S windows -B windows/build -A x64
      - name: Build
        run: cmake --build windows/build --config Release
      - name: Unit tests
        run: ctest --test-dir windows/build -C Release --output-on-failure
      - name: Installer script regression
        run: pwsh -NoProfile -File windows/tests/install_script_test.ps1
      - name: Kill switch purge test
        run: pwsh -NoProfile -File windows/tests/purge_test.ps1 -BinDir windows/build/Release
      - name: Stage distribution
        run: pwsh windows/installer/make-dist.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build Installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\iscc.exe" windows\installer\cronq.iss'
      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = (Get-Content windows/VERSION -Raw).Trim()
          Copy-Item "windows/dist/cronq-setup-$version.exe" windows/dist/cronq-setup.exe
          $hash = (Get-FileHash windows/dist/cronq-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cronq-setup.exe" | Set-Content windows/dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronq-setup
          path: |
            windows/dist/cronq-setup.exe
            windows/dist/SHA256SUMS.txt
      - uses: actions/download-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: cronq-linux
          path: linux-dist
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -ne "v$((Get-Content windows/VERSION -Raw).Trim())") { throw 'Release tag does not match Windows version' }
          gh release create $tag windows/dist/cronq-setup.exe windows/dist/SHA256SUMS.txt linux-dist/cronq-linux-x86_64.tar.gz linux-dist/SHA256SUMS-linux.txt `
            --title $tag --notes-file "windows/$tag.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
