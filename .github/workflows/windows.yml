name: windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  linux-untouched:
    # Windows work must never modify the Linux implementation.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if Linux files changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          windows_changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- windows shared antigravity .github/workflows/windows.yml)
          [ -n "$windows_changed" ] || exit 0
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD" -- src Makefile scripts install.sh uninstall.sh tests cronq.desktop)
          if [ -n "$changed" ]; then
            echo "Windows branch touches Linux files:"; echo "$changed"; exit 1
          fi

  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download frontend gate regression
        run: node frontend/test-download.mjs
      - name: Configure
        run: cmake -S windows -B windows/build -A x64
      - name: Build
        run: cmake --build windows/build --config Release
      - name: Unit tests
        run: ctest --test-dir windows/build -C Release --output-on-failure
      - name: Installer script regression
        run: pwsh -NoProfile -File windows/tests/install_script_test.ps1
      - name: Kill switch purge test
        run: pwsh -NoProfile -File windows/tests/purge_test.ps1 -BinDir windows/build/Release
      - name: Stage distribution
        run: pwsh windows/installer/make-dist.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build Installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\iscc.exe" windows\installer\cronq.iss'
      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = (Get-Content windows/VERSION -Raw).Trim()
          Copy-Item "windows/dist/cronq-setup-$version.exe" windows/dist/cronq-setup.exe
          $hash = (Get-FileHash windows/dist/cronq-setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cronq-setup.exe" | Set-Content windows/dist/SHA256SUMS.txt -Encoding ascii
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cronq-setup
          path: |
            windows/dist/cronq-setup.exe
            windows/dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -ne "v$((Get-Content windows/VERSION -Raw).Trim())") { throw 'Release tag does not match Windows version' }
          gh release create $tag windows/dist/cronq-setup.exe windows/dist/SHA256SUMS.txt `
            --title $tag --notes-file "windows/$tag.md" --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
