<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>404 Not Found</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="error-page">
      <svg class="icon" viewBox="0 0 72 72" width="72" height="72" aria-hidden="true">
        <path d="M18 8h25l15 15v39a2 2 0 0 1-2 2H18a2 2 0 0 1-2-2V10a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <path d="M43 8v15h15" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="29" cy="40" r="2.5" fill="currentColor"/>
        <circle cx="45" cy="40" r="2.5" fill="currentColor"/>
        <path d="M28 54c3-5 13-5 16 0" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>

      <h1>This page can’t be found</h1>
      <p>No webpage was found for the web address: <strong id="url"></strong></p>
      <p class="code" id="code">HTTP ERROR 404</p>

      <button type="button" class="reload" onclick="location.reload()">Reload</button>
    </main>
    <dialog id="gate" aria-labelledby="gate-title">
      <form id="gate-form" method="dialog" autocomplete="off">
        <h2 id="gate-title">Enter secret code</h2>
        <input id="gate-input" type="password" name="k" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Secret code">
        <p id="gate-msg" role="alert"></p>
        <div class="actions">
          <button type="button" id="gate-cancel" class="text">Cancel</button>
          <button type="submit" class="reload">Continue</button>
        </div>
      </form>
    </dialog>
    <script>
      document.getElementById("url").textContent = location.href;

      // Hidden: double-click "HTTP ERROR 404" -> secret code dialog -> download.
      // The installer URL is stored AES-GCM encrypted; the code is the key
      // (PBKDF2-SHA256, 600k iterations). Neither the code nor the URL is in this source.
      var BLOB = {"s":"LxDtLBBrgftUECAlsFuGCg==","i":"JvvypG/DDVehE9nR","c":"6EvcXIBbkFMN9alD0nybz97Bj5UwblfuP18NmXTaEVOWaMfg7teq01/Az7kCP9cVw/lXGfyXjoFL1C+9LrzaEjeXdb+wqluxh6hZKEu+FpyIQOVNWEup/YtjjLebE2pmukAZ4tHMsg=="};
      var gate = document.getElementById("gate"), input = document.getElementById("gate-input"),
          msg = document.getElementById("gate-msg"), busy = false;
      function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

      async function unlock(code) {
        var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
        var key = await crypto.subtle.deriveKey(
          { name: "PBKDF2", salt: b64(BLOB.s), iterations: 600000, hash: "SHA-256" },
          km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
        var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(BLOB.i) }, key, b64(BLOB.c));
        return new TextDecoder().decode(pt);
      }

      document.getElementById("code").addEventListener("dblclick", function () {
        msg.textContent = ""; input.value = "";
        gate.showModal();
        input.focus();
      });
      document.getElementById("gate-cancel").addEventListener("click", function () { gate.close(); });
      gate.addEventListener("click", function (e) { if (e.target === gate) gate.close(); });

      document.getElementById("gate-form").addEventListener("submit", async function (e) {
        e.preventDefault();
        if (busy || !input.value) return;
        busy = true; msg.textContent = "";
        try {
          var url = await unlock(input.value);
          gate.close();
          location.href = url;
        } catch (err) {
          msg.textContent = "Incorrect code";
          gate.classList.remove("shake"); void gate.offsetWidth; gate.classList.add("shake");
          input.select();
        }
        busy = false;
      });
    </script>
  </body>
</html>
