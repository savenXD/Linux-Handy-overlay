# Cronq Configuration

[General]
width = 360
height = 640
margin = 12
# Options: bottom-left, bottom-right, top-left, top-right
corner = bottom-left
# Options: primary or monitor index (0, 1, ...)
monitor = primary
opacity = 1.0
start_visible = false
# Options: mirror, exclusive
default_key_mode = mirror

[Browser]
home_url = https://html5test.com
search_url_template = https://duckduckgo.com/?q=%s
user_agent = Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36

[Hotkeys]
# Shortcuts combine Alt + <key> (Alt+X=Toggle, Alt+G=Ghost, Alt+A/S=Opacity, Alt+F=Fullscreen, Alt+D=DefaultSize, Alt+P=Snap)
toggle_key = x
mode_key = m
ghost_key = g
snap_key = p
ghost_writer_key = w

[Snap]
# Options: monitor (primary), all (all screens)
snap_scope = monitor
snap_delay_ms = 80
snap_save = true
snap_keep_count = 20

[GhostWriter]
ghost_delay_ms = 0
# Options: space, return, skip
ghost_newline = space
# Options: space, tab, skip
ghost_tab = space
ghost_max_chars = 100000
